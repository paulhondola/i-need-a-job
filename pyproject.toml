[project]
name = "job-radar"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pyrefly", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "tests"]
